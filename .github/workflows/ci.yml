name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run tests (offscreen Qt)
        run: python -m pytest

  package-macos:
    name: package macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,package]
      - name: Build .app and .dmg
        run: scripts/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-macOS
          path: dist/Orbital-*.dmg
          if-no-files-found: error

  package-windows:
    name: package Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,package]
      - name: Build portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-Windows
          path: dist/Orbital-*-win64.zip
          if-no-files-found: error

  package-linux:
    name: package Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,package]
      - name: Build tarball (and AppImage when tooling allows)
        run: scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-Linux
          path: dist/Orbital-*-linux-x64.tar.gz
          if-no-files-found: error
